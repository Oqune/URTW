name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: Isolated PowerShell integration
        shell: powershell
        run: ./scripts/test-engine.ps1 -Integration
      - name: Release metadata and credential scan
        shell: powershell
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            ./scripts/check-release.ps1 -Tag '${{ github.ref_name }}'
          } else {
            ./scripts/check-release.ps1
          }

  build:
    needs: checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build and scan portable archive
        shell: powershell
        run: ./scripts/package.ps1 -Arch '${{ matrix.arch }}' -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: URT-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: URT-windows-*
          path: artifacts
          merge-multiple: true
      - name: Verify tag and create immutable publication draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test "$RELEASE_TAG" = "v$version"
          fingerprint=$(tr -d '\r\n' < SIGNING_KEY_FINGERPRINT)
          export GNUPGHOME="$RUNNER_TEMP/urt-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          curl --fail --silent --show-error --location https://github.com/Oqune.gpg -o "$RUNNER_TEMP/urt-public.asc"
          gpg --batch --import "$RUNNER_TEMP/urt-public.asc"
          gpg --batch --list-keys --with-colons "$fingerprint" | grep -F "fpr:::::::::$fingerprint:"
          git verify-tag --raw "$RELEASE_TAG" 2> "$RUNNER_TEMP/urt-tag-status"
          grep -F "[GNUPG:] VALIDSIG $fingerprint " "$RUNNER_TEMP/urt-tag-status"
          cd artifacts
          test -f "URT-$version-windows-amd64.zip"
          test -f "URT-$version-windows-arm64.zip"
          sha256sum "URT-$version-windows-amd64.zip" "URT-$version-windows-arm64.zip" > SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/urt-release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/urt-release.json")" = true
            gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "URT $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS --verify-tag --draft --title "URT $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
          fi
          echo 'Draft is ready. Local GPG checksum signing is required before publication.'
