[package]
name = "urtw"
version = "1.1.1"
edition = "2024"
rust-version = "1.88"
description = "Windows routing dashboard for Mihomo, sing-box, Xray, Zapret and Telegram WS Proxy"
license = "MIT"
repository = "https://github.com/Oqune/URTW"
publish = false

[[bin]]
name = "URTW"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
